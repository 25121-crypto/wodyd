<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세포 수호대</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Malgun Gothic', sans-serif; }
        #gameContainer { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        canvas { background-color: #0a0a2a; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.8); z-index: 10; }
        .hidden { display: none !important; }
        
        h1 { font-size: 3rem; margin-bottom: 10px; color: #4ade80; text-shadow: 0 0 10px #4ade80; }
        p { font-size: 1.2rem; margin-bottom: 20px; text-align: center; line-height: 1.5; }
        .btn { padding: 15px 30px; font-size: 1.2rem; font-weight: bold; color: white; background: #3b82f6; border: none; border-radius: 8px; cursor: pointer; margin: 10px; transition: 0.2s; }
        .btn:hover { background: #2563eb; transform: scale(1.05); }
        .btn-plant { background: #16a34a; }
        .btn-animal { background: #ea580c; }
        
        #quizBox { background: white; color: black; padding: 30px; border-radius: 12px; max-width: 600px; width: 90%; box-shadow: 0 0 30px rgba(255,255,255,0.5); }
        #quizQuestion { font-size: 1.3rem; font-weight: bold; margin-bottom: 20px; }
        .quiz-option { display: block; width: 100%; padding: 12px; margin-bottom: 10px; font-size: 1.1rem; background: #f3f4f6; border: 2px solid #e5e7eb; border-radius: 8px; cursor: pointer; text-align: left; }
        .quiz-option:hover { background: #e0e7ff; border-color: #6366f1; }
        #quizFeedback { margin-top: 20px; font-size: 1.1rem; font-weight: bold; padding: 15px; border-radius: 8px; display: none; }
        .correct { background: #dcfce7; color: #166534; }
        .incorrect { background: #fee2e2; color: #991b1b; }
        
        #hud { position: absolute; top: 10px; left: 10px; font-size: 1.2rem; font-weight: bold; z-index: 5; pointer-events: none; }
        .heart { color: #ef4444; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="600" height="800"></canvas>
    <div id="hud" class="hidden">
        <div>점수: <span id="scoreDisplay">0</span></div>
        <div>목숨: <span id="livesDisplay" class="heart">❤❤❤</span></div>
        <div>모드: <span id="modeDisplay">동물세포 (라이소솜)</span></div>
        <div id="itemStatus" style="color: #fbbf24; margin-top: 5px;"></div>
    </div>

    <!-- 시작 화면 -->
    <div id="startScreen" class="overlay">
        <h1>세포 수호대</h1>
        <p>15초마다 등장하는 '세포 노폐물' 보스를 격파하세요!<br>아이템: 노란색(ATP-공속업), 파란색(라이보솜-다중발사)</p>
        <div>
            <button class="btn btn-animal" onclick="startGame('animal')">동물세포 (라이소솜)</button>
            <button class="btn btn-plant" onclick="startGame('plant')">식물세포 (액포)</button>
        </div>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quizScreen" class="overlay hidden">
        <div id="quizBox">
            <div id="quizQuestion">문제 내용</div>
            <div id="quizOptions"></div>
            <div id="quizFeedback"></div>
            <button id="resumeBtn" class="btn hidden" onclick="resumeGame()" style="width:100%; margin: 20px 0 0 0;">전투 복귀</button>
        </div>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="gameOverScreen" class="overlay hidden">
        <h2 style="color: #ef4444;">세포 파괴 (Game Over)</h2>
        <p>최종 점수: <span id="finalScore">0</span></p>
        <button class="btn" onclick="location.reload()">처음부터 다시</button>
    </div>
</div>

<script>
// 오디오 시스템
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function playSound(type) {
    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    if (type === 'shoot') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'hit') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.2);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    }
}

// 캔버스 및 게임 변수 설정
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let gameState = 'START'; 
let mode = 'animal'; 
let score = 0, lives = 3;
let lastTime = 0, bossTimer = 0, screenShakeTime = 0;

const player = { x: 280, y: 700, width: 40, height: 40, speed: 400, color: '#ea580c', weaponType: 1, fireRate: 200, fireCooldown: 0, invincibleTimer: 0, buffTimer: 0 };
let bullets = [], enemies = [], particles = [], items = [], boss = null;
const keys = {};

// 퀴즈 데이터
const quizzes = {
    animal: [
        { q: "거친면소포체에 붙어있거나 세포질에 흩어져 있으며, 단백질을 합성하는 소기관은?", options: ["마이토콘드리아", "골지체", "라이보솜", "라이소솜"], ans: 2, exp: "라이보솜은 단백질을 합성합니다." },
        { q: "마이토콘드리아 내막의 주름진 구조[ A ]와 세포호흡 효소가 있는 안쪽 공간[ B ]는?", options: ["A: 크리스타, B: 바탕질", "A: 바탕질, B: 크리스타", "A: 스트로마, B: 타이라코이드", "A: 타이라코이드, B: 스트로마"], ans: 0, exp: "내막은 크리스타, 안쪽 공간은 바탕질입니다." }
    ],
    plant: [
        { q: "엽록체 내막 안쪽의 막 구조물인 [ A ]가 쌓여 그라나를 이루고, [ B ]에서 포도당이 합성된다.", options: ["A: 타이라코이드, B: 스트로마", "A: 스트로마, B: 타이라코이드", "A: 크리스타, B: 바탕질", "A: 바탕질, B: 크리스타"], ans: 0, exp: "타이라코이드 막에 색소가 있고 스트로마에서 포도당이 합성됩니다." },
        { q: "물을 흡수하여 삼투압을 조절하고 노폐물을 저장하는 식물세포의 소기관은?", options: ["세포벽", "액포", "중심체", "골지체"], ans: 1, exp: "액포는 식물세포에서 노폐물과 물을 저장합니다." }
    ]
};
let currentQuizList = [];

// 키 입력 이벤트
window.addEventListener('keydown', e => keys[e.code] = true);
window.addEventListener('keyup', e => keys[e.code] = false);

// 게임 시작
function startGame(selectedMode) {
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    mode = selectedMode;
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('hud').classList.remove('hidden');
    
    player.color = mode === 'animal' ? '#ea580c' : '#16a34a';
    document.getElementById('modeDisplay').innerText = mode === 'animal' ? '동물세포 (라이소솜)' : '식물세포 (액포)';
    currentQuizList = [...quizzes[mode]].sort(() => Math.random() - 0.5);
    
    score = 0; lives = 3; bossTimer = 0; 
    bullets = []; enemies = []; particles = []; items = []; boss = null;
    player.x = 280; player.y = 700; player.weaponType = 1; player.fireRate = 200; player.invincibleTimer = 0;
    
    updateLivesDisplay();
    document.getElementById('scoreDisplay').innerText = score;
    gameState = 'PLAYING';
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function updateLivesDisplay() {
    document.getElementById('livesDisplay').innerText = "❤".repeat(Math.max(0, lives));
}

// 메인 루프 (시간 기반 렌더링)
function gameLoop(timestamp) {
    if (gameState === 'GAMEOVER') return;
    
    let dt = timestamp - lastTime;
    lastTime = timestamp;
    if (dt > 100) dt = 100; // 프레임 드롭 방지

    ctx.save();
    if(screenShakeTime > 0) {
        ctx.translate((Math.random()-0.5)*10, (Math.random()-0.5)*10);
        screenShakeTime -= dt;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'PLAYING' || gameState === 'BOSS') {
        updateGame(dt);
        drawGame();
        
        // 정확히 15초(15000ms)마다 보스 스폰
        if (gameState === 'PLAYING') {
            bossTimer += dt;
            if (bossTimer >= 15000) {
                bossTimer = 0;
                spawnBoss();
            }
        }
    } else if (gameState === 'QUIZ') {
        drawGame(); 
    }
    
    ctx.restore();
    if (gameState !== 'GAMEOVER') requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
    // 플레이어 이동
    let moveDist = player.speed * (dt / 1000);
    if (keys['ArrowLeft'] && player.x > 0) player.x -= moveDist;
    if (keys['ArrowRight'] && player.x < canvas.width - player.width) player.x += moveDist;
    if (keys['ArrowUp'] && player.y > 0) player.y -= moveDist;
    if (keys['ArrowDown'] && player.y < canvas.height - player.height) player.y += moveDist;

    // 무적 및 버프 타이머
    if (player.invincibleTimer > 0) player.invincibleTimer -= dt;
    if (player.buffTimer > 0) {
        player.buffTimer -= dt;
        if (player.buffTimer <= 0) {
            player.fireRate = 200; player.weaponType = 1;
            document.getElementById('itemStatus').innerText = "";
        }
    }

    // 총알 발사
    if (player.fireCooldown > 0) player.fireCooldown -= dt;
    if (keys['Space'] && player.fireCooldown <= 0) {
        playSound('shoot');
        player.fireCooldown = player.fireRate;
        let bx = player.x + player.width/2 - 2;
        bullets.push({x: bx, y: player.y, vx: 0, vy: -600, isEnemy: false});
        if(player.weaponType === 2) {
            bullets.push({x: bx, y: player.y, vx: -150, vy: -500, isEnemy: false});
            bullets.push({x: bx, y: player.y, vx: 150, vy: -500, isEnemy: false});
        }
    }

    // 총알 이동
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx * (dt / 1000);
        b.y += b.vy * (dt / 1000);
        
        if (b.isEnemy && checkPointCollision(b, player)) {
            bullets.splice(i, 1);
            takeDamage();
        } else if (b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }

    // 일반 적 스폰 및 이동
    if (gameState === 'PLAYING' && Math.random() < 0.03) {
        enemies.push({ x: Math.random() * (canvas.width - 30), y: -30, width: 30, height: 30, hp: 1, speed: 150 + Math.random()*100 });
    }
    
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed * (dt / 1000);
        
        if (checkCollision(player, e)) {
            takeDamage();
            enemies.splice(i, 1);
            continue;
        }
        
        // 적 총알 피격
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (!b.isEnemy && checkPointCollision(b, e)) {
                bullets.splice(j, 1);
                e.hp--;
                createParticles(b.x, b.y, '#fff', 5);
                if (e.hp <= 0) {
                    score += 10;
                    document.getElementById('scoreDisplay').innerText = score;
                    if(Math.random() < 0.1) items.push({x: e.x, y: e.y, width: 20, height: 20, type: Math.random() > 0.5 ? 'ATP' : 'RIBOSOME'});
                    enemies.splice(i, 1);
                }
                break;
            }
        }
        if (e && e.y > canvas.height) enemies.splice(i, 1);
    }

    // 보스 로직
    if (gameState === 'BOSS' && boss) {
        if(boss.y < 50) boss.y += 100 * (dt / 1000);
        else {
            boss.x += boss.speed * boss.dir * (dt / 1000);
            if(boss.x < 0 || boss.x > canvas.width - boss.width) boss.dir *= -1;
            
            boss.fireTimer -= dt;
            if(boss.fireTimer <= 0) {
                boss.fireTimer = 800; // 0.8초마다 공격
                playSound('shoot');
                let bx = boss.x + boss.width/2;
                let by = boss.y + boss.height;
                bullets.push({x: bx, y: by, vx: 0, vy: 300, isEnemy: true});
                bullets.push({x: bx, y: by, vx: -100, vy: 300, isEnemy: true});
                bullets.push({x: bx, y: by, vx: 100, vy: 300, isEnemy: true});
            }
        }
        
        if (checkCollision(player, boss)) takeDamage();
        
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (!b.isEnemy && checkPointCollision(b, boss)) {
                bullets.splice(j, 1);
                boss.hp--;
                if (boss.hp <= 0) {
                    score += 500;
                    document.getElementById('scoreDisplay').innerText = score;
                    boss = null;
                    showQuiz(); 
                }
                break;
            }
        }
    }

    // 아이템 이동 및 획득
    for (let i = items.length - 1; i >= 0; i--) {
        let item = items[i];
        item.y += 100 * (dt / 1000);
        if (checkCollision(player, item)) {
            if(item.type === 'ATP') {
                player.fireRate = 80; document.getElementById('itemStatus').innerText = "ATP: 공속 증가!";
            } else {
                player.weaponType = 2; document.getElementById('itemStatus').innerText = "라이보솜: 다중 분비!";
            }
            player.buffTimer = 6000;
            items.splice(i, 1);
        } else if (item.y > canvas.height) items.splice(i, 1);
    }

    // 파티클
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx * (dt / 1000); p.y += p.vy * (dt / 1000);
        p.life -= dt / 1000;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function drawGame() {
    // 플레이어 깜빡임 (무적 효과)
    if (player.invincibleTimer <= 0 || Math.floor(Date.now() / 100) % 2 === 0) {
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = '#fff'; ctx.font = '12px Arial';
        ctx.fillText(mode==='animal'?'라이소솜':'액포', player.x - 5, player.y - 5);
    }

    ctx.fillStyle = '#a855f7'; enemies.forEach(e => ctx.fillRect(e.x, e.y, e.width, e.height));
    
    bullets.forEach(b => {
        ctx.fillStyle = b.isEnemy ? '#ef4444' : '#60a5fa';
        ctx.fillRect(b.x, b.y, 4, 15);
    });

    items.forEach(i => {
        ctx.fillStyle = i.type === 'ATP' ? '#fde047' : '#93c5fd';
        ctx.fillRect(i.x, i.y, i.width, i.height);
    });

    if (boss) {
        ctx.fillStyle = '#4b5563'; ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
        ctx.fillStyle = 'red'; ctx.fillRect(boss.x, boss.y - 10, boss.width, 5);
        ctx.fillStyle = 'green'; ctx.fillRect(boss.x, boss.y - 10, boss.width * (boss.hp / boss.maxHp), 5);
    }

    particles.forEach(p => {
        ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4); ctx.globalAlpha = 1.0;
    });
}

function spawnBoss() {
    gameState = 'BOSS';
    boss = { x: 225, y: -100, width: 150, height: 100, hp: 20, maxHp: 20, speed: 200, dir: 1, fireTimer: 0 };
    screenShakeTime = 300;
}

function takeDamage() {
    if (player.invincibleTimer > 0) return;
    lives--; updateLivesDisplay(); playSound('hit'); screenShakeTime = 300;
    if (lives <= 0) gameOver();
    else player.invincibleTimer = 2000; // 2초 무적
}

function checkCollision(r1, r2) { return r1.x < r2.x + r2.width && r1.x + r1.width > r2.x && r1.y < r2.y + r2.height && r1.y + r1.height > r2.y; }
function checkPointCollision(pt, r) { return pt.x > r.x && pt.x < r.x + r.width && pt.y > r.y && pt.y < r.y + r.height; }

function showQuiz() {
    gameState = 'QUIZ'; keys['Space'] = false; 
    let qData = currentQuizList.pop();
    if(!qData) { currentQuizList = [...quizzes[mode]].sort(() => Math.random() - 0.5); qData = currentQuizList.pop(); }
    
    document.getElementById('quizScreen').classList.remove('hidden');
    document.getElementById('quizQuestion').innerText = qData.q;
    document.getElementById('quizFeedback').style.display = 'none';
    document.getElementById('resumeBtn').classList.add('hidden');
    
    const optDiv = document.getElementById('quizOptions');
    optDiv.innerHTML = '';
    qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option'; btn.innerText = (idx+1) + ". " + opt;
        btn.onclick = () => checkAnswer(idx, qData.ans, qData.exp, btn);
        optDiv.appendChild(btn);
    });
}

function checkAnswer(selected, correct, exp, btnElement) {
    const feedback = document.getElementById('quizFeedback');
    feedback.style.display = 'block';
    document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
    
    if(selected === correct) {
        feedback.className = 'correct'; feedback.innerText = "정답!\n" + exp; score += 300; btnElement.style.background = '#dcfce7';
    } else {
        feedback.className = 'incorrect'; feedback.innerText = "오답!\n" + exp; btnElement.style.background = '#fee2e2';
    }
    document.getElementById('scoreDisplay').innerText = score;
    document.getElementById('resumeBtn').classList.remove('hidden');
}

function resumeGame() {
    document.getElementById('quizScreen').classList.add('hidden');
    gameState = 'PLAYING'; bossTimer = 0; lastTime = performance.now(); keys['Space'] = false;
}

function gameOver() {
    gameState = 'GAMEOVER'; screenShakeTime = 500; playSound('hit');
    document.getElementById('hud').classList.add('hidden');
    document.getElementById('gameOverScreen').classList.remove('hidden');
    document.getElementById('finalScore').innerText = score;
}
</script>
</body>
</html>
